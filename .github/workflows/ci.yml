name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-flight runs from older commits on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os == 'ubuntu-latest' && 'build' || 'build (Windows)' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        id: compile
      - run: npm test
      - run: npm run test:smoke
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}

# Releases are tag-driven.
#
#   1. bump the version in a PR:  npm version <patch|minor|major> --no-git-tag-version
#   2. merge it
#   3. tag that commit:           git tag v0.1.30 && git push origin v0.1.30
#
# The tag is the trigger and the contract: it names the version, and
# package.json must already agree (step 4 below fails loudly if it does not).
#
# Nothing here pushes to main. The `require-pr-main` ruleset forbids direct
# pushes to the default branch with no bypass list, which is what broke every
# release between 2026-07-07 and 2026-08-28: the old workflow bumped the version,
# committed `release: X` and pushed it to main, and GitHub rejected the push
# (GH013) before npm was ever contacted. Branch rulesets do not cover tags, so
# pushing refs/tags/v* needs no exemption and the PR rule stays fully intact.
#
# Publishing uses npm OIDC trusted publishing (hence `id-token: write` and the
# absence of an NPM_TOKEN). That config pins org, repo AND this workflow's
# filename, so renaming this file breaks publishing.
#
# Build and natively smoke-test all six standalone bundles before publishing
# to npm. Upload assets to a draft GitHub release, then publish it so installers
# never see a new release without its archives and checksums.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.30'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundles:
    uses: ./.github/workflows/bundles.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  release:
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # A mismatch means the bump PR was never merged, or the wrong commit got
      # tagged. Publishing anyway would ship a package whose version came from
      # neither the tag nor the reviewed diff, so stop before building.
      - name: Check the tag matches package.json
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW_TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          VERSION="${RAW_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag $RAW_TAG does not match package.json ($PKG). Bump package.json in a PR, merge it, then tag that commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Typecheck + build + test
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run test:smoke

      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist-bundles

      - name: Verify release assets
        run: |
          set -euo pipefail
          cd dist-bundles
          sha256sum --check SHA256SUMS
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -f "opper-$target.tar.gz"
          done
          for target in windows-x64 windows-arm64; do
            test -f "opper-$target.zip"
          done

      # Publishing and uploads are idempotent so a re-run can finish a release
      # after an npm publish or GitHub upload failure.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@opperai/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@opperai/cli@$VERSION already published; skipping."
          else
            npm publish --access public
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; finishing its assets."
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi

      - name: Attach the bundles to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        # --clobber supports retries after partially completed uploads or a
        # public release created with this workflow on mutable repositories.
        run: gh release upload "$TAG" dist-bundles/*.tar.gz dist-bundles/*.zip dist-bundles/SHA256SUMS --clobber

      - name: Publish the completed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            echo "Release $TAG is already public; assets updated."
          fi

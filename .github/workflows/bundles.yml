# Build and test the exact standalone archives on every supported platform.
# The release workflow calls this workflow before publishing anything.
name: Bundles

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to this workflow's ref
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-bundles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            dist-bundles/*.tar.gz
            dist-bundles/*.zip
            dist-bundles/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            extension: tar.gz
          - os: macos-15-intel
            target: darwin-x64
            extension: tar.gz
          - os: macos-latest
            target: darwin-arm64
            extension: tar.gz
          - os: windows-latest
            target: windows-x64
            extension: zip
          - os: windows-11-arm
            target: windows-arm64
            extension: zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist-bundles
      - name: Smoke-test the POSIX bundle
        if: runner.os != 'Windows'
        run: scripts/smoke-bundle.sh dist-bundles/opper-${{ matrix.target }}.${{ matrix.extension }}
      - name: Smoke-test the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-bundle.ps1 dist-bundles/opper-${{ matrix.target }}.${{ matrix.extension }}
